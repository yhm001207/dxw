name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install pyinstaller-hooks-contrib

      - name: Build App
        run: |
          pyinstaller `
            --name="DXW同步客户端" `
            --windowed `
            --onefile `
            --noconfirm `
            --clean `
            --hidden-import=PySide6 `
            --hidden-import=PySide6.QtWidgets `
            --hidden-import=PySide6.QtCore `
            --hidden-import=PySide6.QtGui `
            --hidden-import=PySide6.QtSvg `
            --hidden-import=PySide6.QtSvgWidgets `
            --hidden-import=psutil `
            --hidden-import=requests `
            --hidden-import=core.config `
            --hidden-import=core.sync_engine `
            --hidden-import=ui.main_window `
            --hidden-import=ui.animations `
            --hidden-import=ui.widgets `
            --hidden-import=ui.pages `
            --hidden-import=dialogs `
            --collect-all=PySide6 `
            --add-data="sync_client_ui/resources;resources" `
            sync_client_ui/main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXW同步客户端-Windows
          path: dist/DXW同步客户端.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DXW同步客户端.exe
          draft: false
          prerelease: false
