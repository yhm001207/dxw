<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 服务器远程链接</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .register-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 48px;
    min-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .register-box h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: #569cd6;
  }
  .register-box .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #569cd6;
  }
  .btn-register {
    width: 100%;
    padding: 14px;
    background: #0e639c;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-register:hover {
    background: #1177bb;
  }
  .btn-register:disabled {
    background: #3c3c3c;
    cursor: not-allowed;
  }
  .error-msg {
    background: #dc2626;
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .success-msg {
    background: #16a34a;
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .switch-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #94a3b8;
  }
  .switch-link a {
    color: #569cd6;
    text-decoration: none;
    font-weight: 500;
  }
  .switch-link a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="register-box">
    <h1>🖥️ 服务器远程链接</h1>
    <p class="subtitle">注册新账号</p>
    
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    
    <form id="registerForm" onsubmit="doRegister(event)">
      <div class="form-group">
        <label for="username">用户名（3-20字符）</label>
        <input type="text" id="username" placeholder="输入用户名" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">密码（至少6字符）</label>
        <input type="password" id="password" placeholder="输入密码" required>
      </div>
      <div class="form-group">
        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" placeholder="再次输入密码" required>
      </div>
      <button type="submit" class="btn-register" id="registerBtn">注册</button>
    </form>
    
    <div class="switch-link">
      已有账号？<a href="/login">立即登录</a>
    </div>
  </div>

  <script>
  function doRegister(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('registerBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '注册中...';
    
    if (password !== confirm) {
      errorMsg.textContent = '两次密码不一致';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '注册';
      return;
    }
    
    fetch('/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password, confirm})
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        errorMsg.textContent = data.error;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '注册';
      } else if (data.ok) {
        successMsg.textContent = '注册成功！正在跳转...';
        successMsg.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/upload';
        }, 1000);
      }
    })
    .catch(err => {
      errorMsg.textContent = '网络错误，请重试';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '注册';
    });
  }
  </script>
</body>
</html>
