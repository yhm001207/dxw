<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线用户</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1e3a5f, #0f172a);
    padding: 20px 32px; border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; }
  .back-link:hover { color: #e2e8f0; }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

  .summary-row {
    display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .summary-card {
    flex: 1; min-width: 160px;
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 20px; text-align: center;
  }
  .summary-card .num {
    font-size: 40px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .summary-card .label { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  .user-list { display: flex; flex-direction: column; gap: 12px; }
  .user-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 20px 24px; display: flex; align-items: center; gap: 16px;
    transition: all 0.2s;
  }
  .user-card:hover {
    border-color: #569cd6; background: #1e293b;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .user-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-name {
    font-size: 16px; font-weight: 700; color: #f1f5f9;
    display: flex; align-items: center; gap: 8px;
  }
  .user-name .online-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.5);
  }
  .user-meta {
    font-size: 13px; color: #94a3b8; margin-top: 4px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .user-meta span { display: flex; align-items: center; gap: 4px; }
  .user-path {
    margin-top: 8px; font-size: 12px; color: #64748b;
    background: #0f172a; padding: 6px 10px; border-radius: 6px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .user-requests {
    background: #0f172a; border-radius: 8px; padding: 10px 16px;
    text-align: center; flex-shrink: 0;
  }
  .user-requests .rq-num {
    font-size: 24px; font-weight: 700; color: #38bdf8;
  }
  .user-requests .rq-label {
    font-size: 11px; color: #64748b; margin-top: 2px;
  }

  .empty-state {
    text-align: center; padding: 60px 20px; color: #64748b;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .avatar-colors {
    --c0: #3b82f6; --c1: #8b5cf6; --c2: #ec4899; --c3: #f59e0b;
    --c4: #10b981; --c5: #ef4444; --c6: #06b6d4; --c7: #a855f7;
  }

  @media (max-width: 640px) {
    .user-card { flex-direction: column; align-items: flex-start; }
    .user-requests { align-self: flex-end; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>👥 在线用户</h1>
    <p>当前活跃用户及最近访问状态（5分钟内有请求）</p>
  </div>
  <div class="header-right">
    <span id="autoHint" style="font-size:12px;color:#64748b;">自动刷新中</span>
    <a class="back-link" href="/">← 返回控制面板</a>
  </div>
</div>

<div class="container">
  <div class="summary-row">
    <div class="summary-card">
      <div class="num" id="onlineCount">-</div>
      <div class="label">在线用户</div>
    </div>
    <div class="summary-card">
      <div class="num" id="totalRequests">-</div>
      <div class="label">5分钟内请求</div>
    </div>
    <div class="summary-card">
      <div class="num" id="activePaths">-</div>
      <div class="label">访问页面数</div>
    </div>
  </div>

  <div class="user-list" id="userList">
    <div class="empty-state"><div class="icon">⏳</div><p>加载中...</p></div>
  </div>
</div>

<script>
var avatarColors = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#06b6d4','#a855f7'];

function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function loadOnlineUsers() {
  fetch('/api/online_users?_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var list = document.getElementById('userList');
      document.getElementById('onlineCount').textContent = data.length;

      var totalRq = 0;
      var paths = new Set();
      data.forEach(function(u) {
        totalRq += u.requests;
        if (u.last_path) paths.add(u.last_path);
      });
      document.getElementById('totalRequests').textContent = totalRq;
      document.getElementById('activePaths').textContent = paths.size;

      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">😴</div><p>当前没有在线用户</p></div>';
        return;
      }

      list.innerHTML = data.map(function(u) {
        var color = avatarColors[hashStr(u.username) % avatarColors.length];
        var initial = u.username.charAt(0).toUpperCase();
        return '<div class="user-card">'
          + '<a href="/user/' + u.username + '" style="text-decoration:none;"><div class="user-avatar" style="background:' + color + ';position:relative;overflow:hidden;">'
          + '<img src="/api/profile/avatar/' + u.username + '?w=40" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" onerror="this.style.display=\'none\'">'
          + '<span style="position:relative;z-index:1;">' + initial + '</span>'
          + '</div></a>'
          + '<div class="user-info">'
          + '  <div class="user-name"><span class="online-dot"></span><a href="/user/' + u.username + '" style="color:inherit;text-decoration:none;">' + u.username + '</a> <a href="/messages?to=' + u.username + '" style="color:#569cd6;font-size:11px;text-decoration:none;margin-left:6px;">💬</a></div>'
          + '  <div class="user-meta">'
          + '    <span>📡 ' + (u.ip || '-') + '</span>'
          + '    <span>🕐 ' + (u.last_time || '-') + '</span>'
          + '  </div>'
          + '  <div class="user-path">📍 ' + (u.last_path || '-') + '</div>'
          + '  <div class="user-procs" id="userProcs_' + u.username + '" style="margin-top:4px;font-size:11px;color:#4ec9b0;"></div>'
          + '</div>'
          + '<div class="user-requests">'
          + '  <div class="rq-num">' + u.requests + '</div>'
          + '  <div class="rq-label">请求</div>'
          + '</div>'
          + '</div>';
      }).join('');
      // 加载活跃进程信息
      loadActiveProcsForUsers(data);
    })
    .catch(function() {
      document.getElementById('userList').innerHTML =
        '<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>';
    });
}

loadOnlineUsers();
setInterval(loadOnlineUsers, 5000);

// ==================== 活跃进程加载 ====================
var _allActiveProcs = [];

function loadActiveProcsForUsers(onlineUsers) {
  fetch('/api/active_user_processes?_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      _allActiveProcs = data || [];
      // 为每个在线用户填充进程信息
      var userSet = {};
      _allActiveProcs.forEach(function(p) {
        if (!userSet[p.username]) userSet[p.username] = [];
        userSet[p.username].push(p);
      });
      onlineUsers.forEach(function(u) {
        var el = document.getElementById('userProcs_' + u.username);
        if (!el) return;
        var procs = userSet[u.username];
        if (procs && procs.length > 0) {
          el.innerHTML = '▶ 运行中: ' + procs.map(function(p) {
            var label = p.filename.split('/').pop();
            return label;
          }).join(', ');
        } else {
          el.innerHTML = '';
        }
      });
    })
    .catch(function() {});
}
var blink = true;
setInterval(function() {
  var el = document.getElementById('autoHint');
  if (el) { el.style.opacity = blink ? '1' : '0.4'; blink = !blink; }
}, 1000);
</script>

</body>
</html>
